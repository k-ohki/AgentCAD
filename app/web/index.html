<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AgentCAD</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar"></header>  <!-- toolbar.js が組み立てる（標準ツールバー + CommandManager） -->

<main>
  <aside id="left">
    <section id="asm-left" hidden>
      <h2>部品</h2>
      <ol id="asm-comps" class="list"></ol>
      <form id="asm-add" autocomplete="off">
        <select name="part" title="追加するパート"></select>
        <button>部品を追加</button>
      </form>
      <h2>合致</h2>
      <ol id="asm-mates" class="list"></ol>
    </section>
    <section id="drw-left" hidden>
      <h2>図面</h2>
      <ol id="drw-tree" class="list" aria-label="図面の一覧"></ol>
    </section>
    <section class="part-only">
      <h2>フィーチャーツリー</h2>
      <ol id="tree" aria-label="フィーチャーツリー"></ol>
    </section>
    <section class="part-only">
      <h2>グローバル変数</h2>
      <table id="vars"></table>
      <form id="var-add" autocomplete="off">
        <input name="name" placeholder="名前" size="6" required pattern="[A-Za-z_][A-Za-z0-9_]*">
        <input name="expr" placeholder="式" size="8" required>
        <button>追加</button>
      </form>
    </section>
  </aside>

  <section id="viewport">
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <canvas id="sheet" hidden></canvas>
    <div id="mate-popup" hidden></div>
    <div id="confirm-corner" hidden>
      <label class="toggle"><input type="checkbox" id="show-glyphs" checked>拘束記号</label>
      <button id="btn-sketch-end" class="primary" title="スケッチを終了 (Ctrl+Enter)">✓ スケッチ終了</button>
    </div>
    <div id="status"><span id="status-pick"></span><span class="status-right"><span id="status-info"></span><label id="status-vol-toggle" title="ステータスバーに体積を表示する（普段は計算しない。質量特性は評価のタブ）"><input type="checkbox" id="show-volume"> 体積</label></span></div>
  </section>

  <aside id="right">
    <h2 id="prop-title">プロパティ</h2>
    <div id="prop">フィーチャーツリーで項目を選ぶと、ここで寸法やパラメータを編集できます。</div>
  </aside>

  <aside id="ai" hidden></aside>  <!-- AI アシスタント（agent_ui.js が組み立てる。D67） -->
</main>

<div id="ctx-menu" class="menu" hidden></div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
